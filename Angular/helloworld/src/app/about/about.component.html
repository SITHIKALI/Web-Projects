<p>about works!</p>
<p>Welcome to about page</p>
<p>User Information click the user name to get the user details</p>
<div style="margin: 20px 0;">
  <div *ngFor="let person of people" style="margin: 10px 0;">
    <a [routerLink]="['/about', person.name]" 
       style="color: blue; text-decoration: none; font-size: 18px;">
      📋 {{ person.name }}
    </a>
  </div>
</div>

<fieldset style="padding: 20px; margin: 20px 0; border: 2px solid #ccc;">
  <legend style="font-weight: bold;">About User</legend>
  
  <div *ngIf="user">
    <p>👤 <strong>User Name:</strong> {{ user.name }}</p>
    <p>🎂 <strong>User Age:</strong> {{ user.age }}</p>
    <p>🏠 <strong>User Address:</strong> {{ user.address }}</p>
    <p>🌍 <strong>Country:</strong> {{ user.country }}</p>
  </div>
  
  <p *ngIf="!user" style="color: gray; font-style: italic;">
    👆 Select a user to see details
  </p>
</fieldset>
