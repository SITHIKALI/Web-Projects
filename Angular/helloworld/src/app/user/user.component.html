<div class="simple-user-container">
  <h2>Users from LocalStorage</h2>
  
  <!-- Show total count -->
  <p><strong>Total Users:</strong> {{ users.length }}</p>
  
  <!-- Simple button to clear data -->
  <button (click)="clearData()" class="clear-btn">
    Clear All Data
  </button>
  
  <hr>
  
  <!-- Display all users -->
  <h3>User List:</h3>
  
  <div *ngIf="users.length === 0" class="no-users">
    <p>No users found in localStorage!</p>
  </div>
  
  <div *ngIf="users.length > 0" class="users-simple-list">
    <div *ngFor="let user of users; let i = index" class="user-simple-card">
      <h4>{{ i + 1 }}. {{ user.name }}</h4>
      <p><strong>Email:</strong> {{ user.email }}</p>
      <p><strong>Age:</strong> {{ user.age }}</p>
      <p><strong>Country:</strong> {{ user.country }}</p>
      <p><strong>ID:</strong> {{ user.id }}</p>
    </div>
  </div>
</div>
